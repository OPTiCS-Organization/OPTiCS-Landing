server {
    listen 80;

    root /usr/share/nginx/html;
    index index.html;

    # 해시가 붙은 자산은 내용이 바뀌면 파일명도 바뀌므로 오래 캐시해도 안전하다.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # index.html 은 절대 캐시하지 않는다. 새 배포가 즉시 반영돼야 한다.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # OG 이미지는 파일명에 해시가 없다. 소셜 크롤러가 오래 들고 있어도
    # 곤란하지 않을 만큼만 캐시하고, 새 이미지를 올리면 하루 안에 갈린다.
    location = /og.png {
        expires 1d;
        add_header Cache-Control "public";
    }

    # MPA 라우팅. /pricing 처럼 확장자 없는 경로를 같은 이름의 .html 로 먼저 찾는다.
    location / {
        try_files $uri $uri.html $uri/ /index.html;
    }
}
