# optics.run 호스트 nginx 사이트 설정.
#
# 정적 파일 배포에는 reload 가 필요 없다. nginx 는 요청마다 root 아래 경로를 다시
# 열기 때문에, 배포가 landing 심링크를 갈아끼우면 다음 요청부터 새 릴리스가 나간다.
# reload 가 필요한 건 '이 파일이 바뀔 때'뿐이고, 그 절차는 deploy/README.md 에 있다.

# www 는 붙잡아서 넘긴다.
#
# 예전에는 아래 블록이 두 이름을 같이 받아, 같은 문서가 optics.run 과 www.optics.run
# 두 주소로 200 을 냈다. canonical 태그가 있으니 검색 엔진은 대개 옳게 합치지만,
# '대개'에 기대는 것과 서버가 답을 정해 주는 것은 다르다. 301 은 크롤러에게도
# 사람에게도 정답이 하나라고 말한다.
#
# 이 블록이 위에 있어야 한다. nginx 는 server_name 을 정확히 일치하는 쪽에 먼저 주므로
# 순서 자체가 의미를 바꾸지는 않지만, 읽는 사람에게는 '먼저 걸러진다'가 보여야 한다.
server {
    listen 80;
    listen [::]:80;
    server_name www.optics.run;

    return 301 https://optics.run$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name optics.run;

    # landing.releases/<커밋 sha> 를 가리키는 심링크. 배포는 이 심링크만 바꾼다.
    # open_file_cache 를 켜면 캐시가 옛 경로를 붙잡아 배포가 반영되지 않는다.
    # 켜야 한다면 배포 마지막에 reload 를 넣어야 한다.
    root /srv/release/landing;
    index index.html;

    # 기본값은 캐시 금지. HTML 을 개별 location 으로 잡으면 try_files 로 서빙되는
    # /pricing 이 규칙 밖으로 새기 때문에(try_files 는 location 을 다시 매칭하지 않는다)
    # 서버 레벨에서 막고, 안전한 것만 아래에서 예외로 연다.
    add_header Cache-Control "no-cache";

    # HTML 을 압축한다. 빌드가 크롤러용 본문을 HTML 안에 그려 넣기 때문에
    # index.html 이 180KB 를 넘는다(압축하면 27KB 대다). 배포판 기본 nginx.conf 에도
    # gzip on 이 있지만, 그 파일은 이 저장소가 관리하지 않으므로 여기서 다시 켠다.
    # text/html 은 gzip_types 에 적지 않아도 항상 포함된다.
    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/xml;
    gzip_min_length 1024;
    # 프록시(Cloudflare)를 거쳐 온 요청에도 압축해서 준다. 기본값 off 는 그 경우를 건너뛴다.
    gzip_proxied any;

    # 해시가 붙은 자산은 내용이 바뀌면 파일명도 바뀌므로 오래 캐시해도 안전하다.
    # 이 블록에 add_header 가 있으면 위 서버 레벨 헤더는 상속되지 않고 대체된다.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # OG 이미지는 파일명에 해시가 없다. 소셜 크롤러가 오래 들고 있어도
    # 곤란하지 않을 만큼만 캐시하고, 새 이미지를 올리면 하루 안에 갈린다.
    location = /og.png {
        expires 1d;
        add_header Cache-Control "public";
    }

    # MPA 라우팅. /pricing 처럼 확장자 없는 경로를 같은 이름의 .html 로 먼저 찾는다.
    #
    # 마지막이 =404 다. 전에는 /index.html 이었고, 그건 존재하지 않는 모든 경로에
    # 200 과 함께 랜딩 페이지를 줬다. 라우터가 있는 SPA 라면 필요한 폴백이지만 이
    # 사이트는 페이지가 둘뿐인 MPA 라, 그 폴백이 하는 일은 '내용이 같은 문서가 무한한
    # 주소로 존재한다'고 검색 엔진에 알리는 것뿐이었다(soft 404). 오타 링크 하나가
    # 색인에 남을 수 있고, 그렇게 들어온 페이지는 중복 문서로 랜딩의 평가를 깎는다.
    #
    # 지금은 nginx 기본 404 화면이 나간다. 디자인된 404 페이지가 필요하면 빌드에
    # 404.html 을 추가하고 error_page 404 /404.html 을 여기에 둔다 — 상태 코드는
    # 404 로 유지해야 한다.
    location / {
        try_files $uri $uri.html $uri/ =404;
    }
}
